<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Atualizar Report Fotus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',Arial,sans-serif;background:#f0f2f5;color:#16284c;-webkit-font-smoothing:antialiased;min-height:100vh}
.page{max-width:900px;margin:0 auto;padding:40px 20px 60px}
.header{background:#16284c;color:#fff;border-radius:18px;padding:24px 28px;margin-bottom:28px;display:flex;align-items:center;gap:16px}
.header img{height:40px;width:auto}
.header div h1{font-size:17px;font-weight:800}
.header div p{font-size:11px;color:rgba(255,255,255,.6);margin-top:3px;font-weight:500;text-transform:uppercase;letter-spacing:.14em}
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(22,40,76,.08);margin-bottom:20px}
.card h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#16284c;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #f0f2f5}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.full{grid-template-columns:1fr}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
label{display:flex;flex-direction:column;gap:5px}
label span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#6f7785}
input,textarea,select{border:1.5px solid #ddd5c6;border-radius:10px;padding:10px 12px;font-family:'Montserrat',sans-serif;font-size:12px;color:#16284c;outline:none;transition:border .2s;background:#fdfaf4}
input:focus,textarea:focus{border-color:#135b9c;background:#fff}
textarea{resize:vertical;min-height:90px;line-height:1.6}
.login-wrap{max-width:360px;margin:100px auto 0}
.login-wrap .card{padding:32px}
.login-wrap h2{text-align:center;margin-bottom:24px;font-size:16px}
.btn{width:100%;background:#16284c;color:#fff;border:0;border-radius:12px;padding:13px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s;text-transform:uppercase;letter-spacing:.08em}
.btn:hover{background:#1a3360}
.btn-secondary{background:#f0f2f5;color:#16284c;margin-top:10px}
.btn-secondary:hover{background:#e2e6ec}
.btn-success{background:#2d6a0f}
.btn-success:hover{background:#3a8712}
.status{border-radius:12px;padding:12px 16px;font-size:12px;font-weight:600;margin-top:16px;display:none}
.status.ok{display:block;background:#d4edba;color:#2d6a0f}
.status.err{display:block;background:#f5c6c3;color:#7f241b}
.status.loading{display:block;background:#fde9a2;color:#7a5200}
.camp-section{border:1.5px solid #f0f2f5;border-radius:12px;padding:16px;margin-bottom:12px}
.camp-section h3{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#135b9c;margin-bottom:14px}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-screen">
  <div class="card">
    <h2>🔒 Admin — Report Fotus</h2>
    <label><span>Senha</span><input type="password" id="senha-input" placeholder="Digite a senha..." autocomplete="current-password"/></label>
    <button class="btn" style="margin-top:16px" onclick="autenticar()">Entrar</button>
    <div class="status err" id="login-erro">Senha incorreta.</div>
  </div>
</div>

<!-- ADMIN FORM -->
<div class="page hidden" id="admin-screen">

  <div class="header">
    <img src="https://fotus.com.br/wp-content/uploads/2024/10/LOGO_Fotus-Track-Page-1A.png" alt="Fotus"/>
    <div>
      <h1>Atualizar Report de Campanhas</h1>
      <p>Painel de atualização · Time de Marketing</p>
    </div>
  </div>

  <!-- METADADOS -->
  <div class="card">
    <h2>📅 Informações Gerais</h2>
    <div class="form-row three">
      <label><span>Período</span><input id="m_periodo" placeholder="ex: Março 2026"/></label>
      <label><span>Data de Atualização</span><input id="m_data" placeholder="ex: 20/03/2026"/></label>
    </div>
    <div class="form-row full">
      <label><span>Resumo para a Diretoria (use **negrito** para destacar)</span><textarea id="m_resumo"></textarea></label>
    </div>
    <div class="form-row full">
      <label><span>Alerta CRM × Plataforma</span><textarea id="m_alerta" style="min-height:60px"></textarea></label>
    </div>
  </div>

  <!-- CAMPANHAS -->
  <div class="card">
    <h2>📊 KPIs das Campanhas</h2>

    <div class="camp-section">
      <h3>🔴 1ª Compra</h3>
      <div class="form-row three">
        <label><span>KPI Principal</span><input id="pc_kpi" placeholder="ex: 0,4%"/></label>
        <label><span>Label do KPI</span><input id="pc_label" placeholder="ex: conversão · meta 1,2%"/></label>
        <label><span>Barra % (0–100)</span><input id="pc_bar" type="number" min="0" max="100"/></label>
      </div>
      <div class="form-row">
        <label><span>Rodapé esquerdo (valor)</span><input id="pc_r1v" placeholder="ex: 19"/></label>
        <label><span>Rodapé esquerdo (label)</span><input id="pc_r1l" placeholder="ex: vendas"/></label>
      </div>
      <div class="form-row">
        <label><span>Rodapé direito (valor)</span><input id="pc_r2v" placeholder="ex: 2.081"/></label>
        <label><span>Rodapé direito (label)</span><input id="pc_r2l" placeholder="ex: não tratados (46%)"/></label>
      </div>
    </div>

    <div class="camp-section">
      <h3>🔴 Recompra</h3>
      <div class="form-row three">
        <label><span>KPI Principal</span><input id="rc_kpi" placeholder="ex: 11%"/></label>
        <label><span>Label do KPI</span><input id="rc_label" placeholder="ex: atingimento · meta 52,5%"/></label>
        <label><span>Barra % (0–100)</span><input id="rc_bar" type="number" min="0" max="100"/></label>
      </div>
      <div class="form-row">
        <label><span>Rodapé esquerdo (valor)</span><input id="rc_r1v"/></label>
        <label><span>Rodapé esquerdo (label)</span><input id="rc_r1l" placeholder="ex: recompras"/></label>
      </div>
      <div class="form-row">
        <label><span>Rodapé direito (valor)</span><input id="rc_r2v"/></label>
        <label><span>Rodapé direito (label)</span><input id="rc_r2l" placeholder="ex: meta"/></label>
      </div>
    </div>

    <div class="camp-section">
      <h3>🟢 Híbrido</h3>
      <div class="form-row three">
        <label><span>KPI Principal</span><input id="hb_kpi" placeholder="ex: 111%"/></label>
        <label><span>Label do KPI</span><input id="hb_label" placeholder="ex: da meta atingida"/></label>
        <label><span>Barra % (0–100)</span><input id="hb_bar" type="number" min="0" max="100"/></label>
      </div>
      <div class="form-row">
        <label><span>Rodapé esquerdo (valor)</span><input id="hb_r1v"/></label>
        <label><span>Rodapé esquerdo (label)</span><input id="hb_r1l" placeholder="ex: conversões"/></label>
      </div>
      <div class="form-row">
        <label><span>Rodapé direito (valor)</span><input id="hb_r2v"/></label>
        <label><span>Rodapé direito (label)</span><input id="hb_r2l" placeholder="ex: meta"/></label>
      </div>
    </div>

    <div class="camp-section">
      <h3>🔴 Resgate 360</h3>
      <div class="form-row three">
        <label><span>KPI Principal</span><input id="rs_kpi" placeholder="ex: 0,8%"/></label>
        <label><span>Label do KPI</span><input id="rs_label" placeholder="ex: conversão · meta 1,5%"/></label>
        <label><span>Barra % (0–100)</span><input id="rs_bar" type="number" min="0" max="100"/></label>
      </div>
      <div class="form-row">
        <label><span>Rodapé esquerdo (valor)</span><input id="rs_r1v"/></label>
        <label><span>Rodapé esquerdo (label)</span><input id="rs_r1l" placeholder="ex: vendas"/></label>
      </div>
      <div class="form-row">
        <label><span>Rodapé direito (valor)</span><input id="rs_r2v"/></label>
        <label><span>Rodapé direito (label)</span><input id="rs_r2l" placeholder="ex: não tratados (52%)"/></label>
      </div>
    </div>
  </div>

  <button class="btn btn-success" onclick="publicar()">🚀 Publicar Atualização</button>
  <button class="btn btn-secondary" onclick="window.location='/'">← Ver Report</button>
  <div class="status" id="pub-status"></div>

</div>

<script>
const SENHA = 'fotus2026';

function autenticar() {
  const v = document.getElementById('senha-input').value;
  if (v === SENHA) {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('admin-screen').classList.remove('hidden');
    carregarDados();
  } else {
    document.getElementById('login-erro').style.display = 'block';
  }
}
document.getElementById('senha-input').addEventListener('keydown', e => { if(e.key==='Enter') autenticar(); });

async function carregarDados() {
  try {
    const res = await fetch('/data/campanhas.json?t=' + Date.now());
    const d = await res.json();
    document.getElementById('m_periodo').value  = d.meta.periodo || '';
    document.getElementById('m_data').value     = d.meta.atualizadoEm || '';
    document.getElementById('m_resumo').value   = d.meta.resumoDiretoria || '';
    document.getElementById('m_alerta').value   = d.meta.alertaDivergencia || '';
    d.campanhas.forEach(c => {
      const set = (id, val) => { const el = document.getElementById(id); if(el) el.value = val || ''; };
      set(`${c.id}_kpi`,   c.kpiPrincipal);
      set(`${c.id}_label`, c.kpiLabel);
      set(`${c.id}_bar`,   c.barPct);
      set(`${c.id}_r1v`,   c.rodape1Valor);
      set(`${c.id}_r1l`,   c.rodape1Label);
      set(`${c.id}_r2v`,   c.rodape2Valor);
      set(`${c.id}_r2l`,   c.rodape2Label);
    });
  } catch(e) { console.error('Erro ao carregar dados', e); }
}

async function publicar() {
  const status = document.getElementById('pub-status');
  status.className = 'status loading';
  status.textContent = '⏳ Publicando... aguarde ~60 segundos para o site atualizar.';

  const g = id => document.getElementById(id)?.value?.trim() || '';

  const payload = {
    meta: {
      periodo:          g('m_periodo'),
      atualizadoEm:     g('m_data'),
      resumoDiretoria:  g('m_resumo'),
      alertaDivergencia:g('m_alerta')
    },
    campanhasUpdate: ['pc','rc','hb','rs'].map(id => ({
      id,
      kpiPrincipal: g(`${id}_kpi`),
      kpiLabel:     g(`${id}_label`),
      barPct:       parseInt(g(`${id}_bar`)) || 0,
      rodape1Valor: g(`${id}_r1v`),
      rodape1Label: g(`${id}_r1l`),
      rodape2Valor: g(`${id}_r2v`),
      rodape2Label: g(`${id}_r2l`)
    }))
  };

  try {
    const res = await fetch('/api/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (res.ok) {
      status.className = 'status ok';
      status.textContent = '✅ Publicado com sucesso! O report estará atualizado em ~60 segundos.';
    } else {
      throw new Error(data.error || 'Erro desconhecido');
    }
  } catch(e) {
    status.className = 'status err';
    status.textContent = '❌ Erro ao publicar: ' + e.message;
  }
}
</script>
</body>
</html>
