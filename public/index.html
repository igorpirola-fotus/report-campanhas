<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Report de desempenho das campanhas MKT | CRM da Fotus Distribuidora Solar"/>
<title>Campanhas MKT | CRM — Fotus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16284c;--brand:#135b9c;--gold:#f3bf18;--border:#ddd5c6;--muted:#6f7785;--bg:#fdfaf4;--panel:rgba(255,255,255,.92);--shadow:0 8px 32px rgba(22,40,76,.08);--success:#2d6a0f;--success-bg:#d4edba;--danger:#7f241b;--danger-bg:#f5c6c3;--warn:#7a5200;--warn-bg:#fde9a2;--neutral-bg:rgba(22,40,76,.07);--neutral:#46516a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px}
.page{max-width:1080px;margin:0 auto;padding:36px 22px 60px;display:grid;gap:28px}
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding-bottom:20px;border-bottom:2px solid var(--border)}
.header-left{display:flex;align-items:center;gap:16px}
.logo-wrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow)}
.logo-img{display:block;height:48px;width:auto}
.header-title h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
.header-title p{margin-top:3px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.16em}
.header-right{text-align:right}
.header-right .tag{display:inline-block;background:var(--ink);color:#fff;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.header-right .date{display:block;margin-top:5px;font-size:11px;color:var(--muted)}
.section-label{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:var(--muted)}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.campaign-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.camp-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:grid;gap:10px}
.camp-card.verde{border-color:rgba(155,190,112,.5);background:rgba(155,190,112,.07)}
.camp-card.critico{border-color:rgba(221,88,76,.3);background:rgba(221,88,76,.04)}
.camp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.camp-name{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.camp-alias{font-size:10px;color:var(--muted);margin-top:2px}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap}
.badge-ok{background:var(--success-bg);color:var(--success)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.camp-main{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1}
.camp-meta{font-size:11px;color:var(--muted);font-weight:500}
.bar-track{height:5px;background:rgba(22,40,76,.1);border-radius:99px;overflow:hidden;margin-top:2px}
.bar-fill{height:100%;border-radius:99px}
.bar-fill.ok{background:#7ab856}
.bar-fill.low{background:rgba(221,88,76,.65)}
.camp-footer{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;font-weight:500}
.camp-footer strong{color:var(--ink);font-weight:700}
.board-block{background:var(--ink);border-radius:20px;padding:24px 28px;position:relative;overflow:hidden}
.board-block::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(243,191,24,.15) 0%,transparent 70%);pointer-events:none}
.board-text{font-size:14px;line-height:1.8;color:rgba(255,255,255,.85);max-width:860px;position:relative;z-index:1;font-weight:400}
.board-text strong{color:#fff;font-weight:700}
.alert-note{background:var(--warn-bg);border:1px solid rgba(243,191,24,.45);border-radius:14px;padding:13px 17px;font-size:12px;color:var(--warn);line-height:1.65;font-weight:500}
.alert-note strong{font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab-btn{border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 16px;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.06em}
.tab-btn:hover{border-color:var(--brand);color:var(--brand)}
.tab-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:auto;box-shadow:var(--shadow)}
.team-table{width:100%;border-collapse:collapse;min-width:600px}
.team-table th{background:#f7f3ea;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;padding:12px 10px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.team-table th:first-child{text-align:left;padding-left:16px}
.team-table td{padding:10px 10px;font-size:12px;font-weight:500;color:rgba(22,40,76,.85);border-bottom:1px solid rgba(221,213,198,.4);text-align:center}
.team-table td:first-child{text-align:left;font-weight:700;color:var(--ink);padding-left:16px}
.team-table tbody tr:last-child td{border-bottom:0;font-weight:700;background:rgba(245,236,220,.45);color:var(--ink)}
.team-table tbody tr:hover:not(:last-child){background:rgba(255,255,255,.95)}
.cell-green{background:var(--success-bg)!important;color:var(--success)!important;font-weight:700!important}
.cell-yellow{background:var(--warn-bg)!important;color:var(--warn)!important;font-weight:700!important}
.cell-red{background:var(--danger-bg)!important;color:var(--danger)!important;font-weight:700!important}
.cell-gray{color:var(--muted)!important}
.footer{text-align:center;font-size:11px;color:var(--muted);padding-top:14px;border-top:1px solid var(--border);font-weight:500}
.loading{display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--muted);font-size:13px;font-weight:600}
@media(max-width:640px){.page{padding:18px 14px 40px}.campaign-row{grid-template-columns:1fr 1fr}.board-text{font-size:13px}}
@media print{.tab-panel{display:block!important}.tabs{display:none}}
</style>
</head>
<body>
<div class="page" id="app">
  <div class="loading">Carregando dados...</div>
</div>
<script>
async function init() {
  const res = await fetch('/data/campanhas.json?t=' + Date.now());
  const d = await res.json();
  const app = document.getElementById('app');
  
  app.innerHTML = `
    <header class="header">
      <div class="header-left">
        <div class="logo-wrap">
          <img src="https://fotus.com.br/wp-content/uploads/2024/10/LOGO_Fotus-Track-Page-1A.png" alt="Fotus" class="logo-img"/>
        </div>
        <div class="header-title">
          <h1>Campanhas MKT | CRM</h1>
          <p>Report de desempenho · ${d.meta.periodo}</p>
        </div>
      </div>
      <div class="header-right">
        <span class="tag">${d.campanhas.length} Campanhas Ativas</span>
        <span class="date">Atualizado em ${d.meta.atualizadoEm}</span>
      </div>
    </header>

    <div>
      <div class="section-label">Visão Consolidada das Campanhas</div>
      <div class="campaign-row" style="margin-top:14px">
        ${d.campanhas.map(c => `
          <div class="camp-card ${c.status}">
            <div class="camp-head">
              <div>
                <div class="camp-name">${c.nome}</div>
                <div class="camp-alias">${c.alias}</div>
              </div>
              <span class="badge ${c.status === 'verde' ? 'badge-ok' : 'badge-danger'}">
                ${c.status === 'verde' ? '🟢 No verde' : '🔴 Crítico'}
              </span>
            </div>
            <div>
              <div class="camp-main">${c.kpiPrincipal}</div>
              <div class="camp-meta">${c.kpiLabel}</div>
            </div>
            <div><div class="bar-track"><div class="bar-fill ${c.status === 'verde' ? 'ok' : 'low'}" style="width:${c.barPct}%"></div></div></div>
            <div class="camp-footer">
              <span><strong>${c.rodape1Valor}</strong> ${c.rodape1Label}</span>
              <span><strong>${c.rodape2Valor}</strong> ${c.rodape2Label}</span>
            </div>
          </div>`).join('')}
      </div>
    </div>

    <div class="board-block">
      <p class="board-text">${formatBold(d.meta.resumoDiretoria)}</p>
    </div>

    <div class="alert-note">
      <strong>⚠ Divergência CRM × Plataforma:</strong> ${d.meta.alertaDivergencia}
    </div>

    <div>
      <div class="section-label" style="margin-bottom:14px">Desempenho por Equipe — Selecione a Campanha</div>
      <div class="tabs" id="tabs">
        ${d.campanhas.map((c,i) => `<button class="tab-btn ${i===0?'active':''}" data-tab="${c.id}">${c.nome}</button>`).join('')}
      </div>
    </div>

    ${d.campanhas.map((c,i) => `
      <div class="tab-panel ${i===0?'active':''}" id="tab-${c.id}">
        <div class="table-wrap">
          <table class="team-table">
            <thead><tr>${d.tabelas[c.id].colunas.map(col => `<th>${col}</th>`).join('')}</tr></thead>
            <tbody>${renderRows(d.tabelas[c.id])}</tbody>
          </table>
        </div>
      </div>`).join('')}

    <footer class="footer">
      Report gerado por Igor Pirola · Analista de Mídia Performance · Fotus Distribuidora Solar · ${d.meta.atualizadoEm}
    </footer>
  `;

  // Tabs
  document.getElementById('tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
}

function formatBold(text) {
  // Wrap **text** in strong tags
  return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
}

function heatClass(val, type) {
  const n = parseFloat(val);
  if (isNaN(n)) return '';
  if (type === 'nt')     return n === 0 ? 'cell-green' : n <= 30 ? 'cell-yellow' : 'cell-red';
  if (type === 'ec')     return n >= 70 ? 'cell-green' : n >= 40 ? 'cell-yellow' : 'cell-red';
  if (type === 'conv')   return n >= 1  ? 'cell-green' : n >= 0.3 ? 'cell-yellow' : n > 0 ? 'cell-red' : 'cell-gray';
  if (type === 'convPct')return n >= 1  ? 'cell-green' : n >= 0.3 ? 'cell-yellow' : n > 0 ? 'cell-red' : 'cell-gray';
  if (type === 'var')    return n >= 80 ? 'cell-green' : n >= 30 ? 'cell-yellow' : n > 0 ? 'cell-red' : 'cell-gray';
  if (type === 'varHb')  return n >= 100? 'cell-green' : n >= 50 ? 'cell-yellow' : n > 0 ? 'cell-red' : 'cell-gray';
  return '';
}

function renderRows(tab) {
  const isTotal = row => row[0] === 'TOTAL GERAL';
  return tab.linhas.map(row => {
    const tot = isTotal(row);
    const cells = row.map((val, i) => {
      const heatType = !tot && tab.heatCols[String(i)] ? tab.heatCols[String(i)] : '';
      const cls = heatType ? heatClass(val.replace('%','').replace(',','.'), heatType) : '';
      return `<td class="${cls}">${val}</td>`;
    });
    return `<tr>${cells.join('')}</tr>`;
  }).join('');
}

init().catch(e => {
  document.getElementById('app').innerHTML = '<div class="loading">Erro ao carregar dados. Tente novamente.</div>';
  console.error(e);
});
</script>
</body>
</html>
